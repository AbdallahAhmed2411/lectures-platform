<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectures Platform</title>
    <!-- Tailwind CSS Library -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        /* Custom Themes */
        :root { --primary-color: #2563eb; --primary-hover: #1d4ed8; }
        [data-theme="purple"] { --primary-color: #7c3aed; --primary-hover: #6d28d9; }
        [data-theme="emerald"] { --primary-color: #059669; --primary-hover: #047857; }
        [data-theme="amber"] { --primary-color: #d97706; --primary-hover: #b45309; }
        [data-theme="rose"] { --primary-color: #e11d48; --primary-hover: #be123c; }

        .dynamic-bg { background-color: var(--primary-color) !important; }
        .dynamic-bg:hover { background-color: var(--primary-hover) !important; }
        .dynamic-text { color: var(--primary-color) !important; }
        .dynamic-border { border-color: var(--primary-color) !important; }

        .theme-hover-card:hover {
            border-color: var(--primary-color) !important;
            background-color: rgba(37, 99, 235, 0.04);
        }
        html.dark .theme-hover-card:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-color: var(--primary-color) !important;
        }

        .recode-hover-card:hover {
            border-color: #a855f7 !important;
            background-color: rgba(168, 85, 247, 0.05);
        }
    </style>
</head>
<body class="min-h-screen p-3 sm:p-6 bg-gray-100 dark:bg-navy-900 text-gray-800 dark:text-white transition-colors duration-300">

                    </button>
                    <!-- Theme Dropdown -->
                    <div id="theme-menu" class="absolute left-0 mt-2 w-44 bg-white dark:bg-navy-800 rounded-xl shadow-2xl border border-gray-200 dark:border-navy-700 p-2 hidden z-50 space-y-1">

                        </button>
                        <button onclick="setTheme('purple')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700 flex items-center gap-2 text-sm">

                        </button>
                        <button onclick="setTheme('emerald')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700 flex items-center gap-2 text-sm">

                        </button>
                        <button onclick="setTheme('amber')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700 flex items-center gap-2 text-sm">
                            <span class="w-3.5 h-3.5 rounded-full bg-amber-600 inline-block"></span> Warm Amber
                        </button>
                        <button onclick="setTheme('rose')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-navy-700 flex items-center gap-2 text-sm">

            </div>
            <div id="favorites-container" class="space-y-3"></div>
        </div>

        <!-- Subjects Grid -->

        <!-- Folders Section -->
        <div id="folders-section" class="hidden">
            <button onclick="goHome()" class="mb-4 bg-gray-300 dark:bg-navy-700 hover:bg-gray-400 px-4 py-2 rounded-lg transition text-sm">

    </main>

        let globalFilesCache = [];
        let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];

        const savedTheme = localStorage.getItem('appTheme') || 'blue';
        setTheme(savedTheme);
        updateFavCount();
        renderSubjects();
        initCache();

        // إعادة التوجيه للرئيسية عند عمل Refresh (إلغاء الـ Hash القديم عند الفتح الأول)
        if (window.location.hash) {
            window.location.hash = '#home';
        }

        window.addEventListener('hashchange', handleRouting);
        window.addEventListener('load', handleRouting);

        function handleRouting() {
            const hash = window.location.hash;
            
            if (!hash || hash === '#home') {
                showHomeUI();
            } else if (hash.startsWith('#subject=')) {
                const subId = parseInt(hash.split('=')[1]);
                const sub = subjectsData.find(s => s.id === subId);
                if (sub) renderFoldersUI(sub);
            } else if (hash.startsWith('#folder=')) {
                const parts = hash.replace('#folder=', '').split('&');
                const subId = parseInt(parts[0]);
                const folderTitle = decodeURIComponent(parts[1]);
                const sub = subjectsData.find(s => s.id === subId);
                if (sub) {
                    const folder = sub.folders.find(f => f.title === folderTitle);
                    if (folder) {
                        currentSubject = sub;
                        if (folder.type === 'youtube') {
                            renderMediaFolderUI(folder);
                        } else {
                            fetchFilesUI(folder.id, folder.title, sub);
                        }
                    }
                }
            } else if (hash === '#favorites') {
                showFavoritesUI();
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fas fa-moon text-gray-700 text-base";
            } else {
                html.classList.add('dark');
                icon.className = "fas fa-sun text-yellow-500 text-base";
            }
        }

        function toggleThemeMenu() {
            document.getElementById('theme-menu').classList.toggle('hidden');
        }

        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('appTheme', themeName);
            document.getElementById('theme-menu').classList.add('hidden');
        }

        window.onclick = function(e) {
            if (!e.target.closest('#theme-menu') && !e.target.closest('button[onclick="toggleThemeMenu()"]')) {
                document.getElementById('theme-menu').classList.add('hidden');
            }
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
        }

        function getDirectDownloadUrl(link) {
            let fileId = '';
            if (link.includes('/d/')) {
                fileId = link.split('/d/')[1].split('/')[0];
            } else if (link.includes('id=')) {
                fileId = new URLSearchParams(link.split('?')[1]).get('id');
            }
            return fileId ? `https://docs.google.com/uc?export=download&id=${fileId}` : link;
        }

        function toggleFavorite(title, link, subjectName, folderName, btnElement) {
            const index = favorites.findIndex(f => f.link === link);
            const icon = btnElement.querySelector('i');

            if (index > -1) {
                favorites.splice(index, 1);
                icon.classList.remove('fas', 'text-red-500');
                icon.classList.add('far', 'text-gray-400');
            } else {
                favorites.push({ title, link, subjectName, folderName });
                icon.classList.remove('far', 'text-gray-400');
                icon.classList.add('fas', 'text-red-500');
            }
            
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            updateFavCount();
            
            if (window.location.hash === '#favorites') showFavoritesUI();
        }

        async function initCache() {
            try {
                for (let sub of subjectsData) {
                    for (let folder of sub.folders) {
                        if (folder.type === 'youtube' || folder.type === 'telegram') continue;
                        const res = await fetch(`${API_URL}?folderId=${folder.id}`);
                        const files = await res.json();
                        files.forEach(f => {
                            globalFilesCache.push({
                                title: f.title, link: f.link,
                                subjectName: sub.title, folderName: folder.title
                            });
                        });
                    }
                }
                document.getElementById('cache-status').innerHTML = '<i class="fas fa-check-circle text-green-500 mr-1"></i> Ready for instant search!';
                setTimeout(() => document.getElementById('cache-status').style.display = 'none', 2000);
            } catch (e) {
                document.getElementById('cache-status').style.display = 'none';
            }
        }

        function renderSubjects() {
            const grid = document.getElementById('subjects-grid');
            grid.innerHTML = '';
            subjectsData.forEach(sub => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-navy-800 p-5 rounded-xl cursor-pointer theme-hover-card border border-gray-300 dark:border-navy-700 transition transform hover:-translate-y-1 shadow flex items-center justify-between';
                card.onclick = () => { window.location.hash = `#subject=${sub.id}`; };
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="bg-blue-100 dark:bg-blue-900/50 p-3.5 rounded-lg dynamic-text">
                            <i class="fas ${sub.icon} text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold">${sub.title}</h3>
                            <p class="text-gray-500 dark:text-gray-400 text-xs">${sub.folders.length} sections</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                `;
                grid.appendChild(card);
            });
        }

        function goHome() {
            window.location.hash = '#home';
        }

        function showHomeUI() {
            document.getElementById('folders-section').classList.add('hidden');
            document.getElementById('files-section').classList.add('hidden');
            document.getElementById('favorites-section').classList.add('hidden');
            document.getElementById('search-results-section').classList.add('hidden');
            document.getElementById('subjects-grid').classList.remove('hidden');
            document.getElementById('page-subtitle').innerText = "Search for any lecture or file easily";
            document.getElementById('searchInput').value = '';
        }

        function renderFoldersUI(sub) {
            currentSubject = sub;
            document.getElementById('subjects-grid').classList.add('hidden');
            document.getElementById('files-section').classList.add('hidden');
            document.getElementById('favorites-section').classList.add('hidden');
            document.getElementById('search-results-section').classList.add('hidden');
            
            document.getElementById('folders-section').classList.remove('hidden');
            document.getElementById('current-subject-title').innerText = sub.title;

            const grid = document.getElementById('folders-grid');
            grid.innerHTML = '';
            sub.folders.forEach(folder => {
                const card = document.createElement('div');
                const isRec = folder.title.toLowerCase().includes('recode');
                
                if (folder.type === 'youtube') {
                    card.onclick = () => { window.location.hash = `#folder=${sub.id}&${encodeURIComponent(folder.title)}`; };
                    card.className = 'bg-white dark:bg-navy-800 p-4 rounded-xl cursor-pointer transition flex justify-between items-center shadow border border-gray-300 dark:border-navy-700 hover:bg-red-50 hover:border-red-300 dark:hover:bg-red-900/20 dark:hover:border-red-700';
                } else if (folder.type === 'youtube-playlist') {
                    card.onclick = () => {
                        window.open(`https://www.youtube.com/playlist?list=${folder.playlistId}`, '_blank');
                    };
                    card.className = 'bg-white dark:bg-navy-800 p-4 rounded-xl cursor-pointer transition flex justify-between items-center shadow border border-gray-300 dark:border-navy-700 hover:bg-red-50 hover:border-red-300 dark:hover:bg-red-900/20 dark:hover:border-red-700';
                } else if (isRec) {
                    card.onclick = () => { window.location.hash = `#folder=${sub.id}&${encodeURIComponent(folder.title)}`; };
                    card.className = 'bg-white dark:bg-navy-800 p-4 rounded-xl cursor-pointer recode-hover-card border border-gray-300 dark:border-navy-700 transition flex justify-between items-center shadow';
                } else {
                    card.onclick = () => { window.location.hash = `#folder=${sub.id}&${encodeURIComponent(folder.title)}`; };
                    card.className = 'bg-white dark:bg-navy-800 p-4 rounded-xl cursor-pointer theme-hover-card border border-gray-300 dark:border-navy-700 transition flex justify-between items-center shadow';
                }

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fas ${isRec ? 'fa-microphone-alt text-purple-500' : (folder.type === 'youtube' ? 'fa-video text-red-500' : 'fa-folder dynamic-text')} text-xl"></i>
                        <span class="font-bold text-sm sm:text-base">${folder.title}</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400 text-sm"></i>
                `;
                grid.appendChild(card);
            });
        }

        function renderMediaFolderUI(folder) {
            document.getElementById('folders-section').classList.add('hidden');
            document.getElementById('files-section').classList.remove('hidden');
            document.getElementById('current-folder-title').innerText = `${currentSubject.title} > ${folder.title}`;
            document.getElementById('back-to-folders').onclick = () => { window.location.hash = `#subject=${currentSubject.id}`; };

            const container = document.getElementById('files-container');
            document.getElementById('files-loader').classList.add('hidden');
            container.innerHTML = '';

            if (!folder.videos && !folder.links) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No content available at the moment.</p>';
                return;
            }

            const items = folder.videos || [];
            items.forEach(item => {
                const link = item.link || `https://www.youtube.com/watch?v=${item.youtubeId}`;
                const isFav = favorites.some(f => f.link === link);

                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-navy-800 p-4 rounded-xl border border-gray-300 dark:border-navy-700 flex justify-between items-center gap-3 shadow transition hover:bg-red-50 hover:border-red-300 dark:hover:bg-red-900/20 dark:hover:border-red-700';
                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate text-left">
                        <i class="fab fa-youtube text-red-500 text-2xl flex-shrink-0"></i>
                        <span class="font-bold text-sm truncate">${item.title}</span>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <a href="${link}" target="_blank" class="bg-red-600 hover:bg-red-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                            <i class="fas fa-play"></i> Watch
                        </a>
                        <button onclick="toggleFavorite('${item.title}', '${link}', '${currentSubject.title}', '${folder.title}', this)" class="p-2 transition hover:scale-110">
                            <i class="${isFav ? 'fas text-red-500' : 'far text-gray-400'} fa-heart text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function fetchFilesUI(folderId, folderTitle, sub) {
            document.getElementById('folders-section').classList.add('hidden');
            document.getElementById('files-section').classList.remove('hidden');
            document.getElementById('current-folder-title').innerText = `${sub.title} > ${folderTitle}`;
            document.getElementById('back-to-folders').onclick = () => { window.location.hash = `#subject=${sub.id}`; };

            const container = document.getElementById('files-container');
            const loader = document.getElementById('files-loader');
            container.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${API_URL}?folderId=${folderId}`);
                const files = await res.json();
                loader.classList.add('hidden');

                if (files.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">No files available in this section.</p>';
                    return;
                }

                const isRecodesFolder = folderTitle.toLowerCase().includes('recode');

                files.forEach(file => {
                    const isFav = favorites.some(f => f.link === file.link);
                    const downloadUrl = getDirectDownloadUrl(file.link);
                    
                    const card = document.createElement('div');
                    card.className = `bg-white dark:bg-navy-800 p-4 rounded-xl border border-gray-300 dark:border-navy-700 flex justify-between items-center gap-3 shadow transition ${isRecodesFolder ? 'recode-hover-card' : 'theme-hover-card'}`;
                    
                    card.innerHTML = `
                        <div class="flex items-center gap-3 truncate text-left">
                            <i class="${isRecodesFolder ? 'fas fa-microphone text-purple-500' : 'fas fa-file-pdf text-red-500'} text-xl flex-shrink-0"></i>
                            <span class="font-bold text-sm truncate">${file.title}</span>
                        </div>
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="openViewer('${file.link}', '${file.title}')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <a href="${downloadUrl}" class="dynamic-bg text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow">
                                <i class="fas fa-download"></i> Download
                            </a>
                            <button onclick="toggleFavorite('${file.title}', '${file.link}', '${sub.title}', '${folderTitle}', this)" class="p-2 transition hover:scale-110">
                                <i class="${isFav ? 'fas text-red-500' : 'far text-gray-400'} fa-heart text-lg"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                loader.classList.add('hidden');
                container.innerHTML = '<p class="text-red-500 text-center py-4">Failed to fetch files. Please check sharing permissions.</p>';
            }
        }

        function globalSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const subjectsGrid = document.getElementById('subjects-grid');
            const searchSec = document.getElementById('search-results-section');
            const container = document.getElementById('search-results-container');
            
            document.getElementById('favorites-section').classList.add('hidden');
            document.getElementById('folders-section').classList.add('hidden');
            document.getElementById('files-section').classList.add('hidden');

            if (!query) {
                searchSec.classList.add('hidden');
                subjectsGrid.classList.remove('hidden');
                return;
            }

            subjectsGrid.classList.add('hidden');
            searchSec.classList.remove('hidden');
            container.innerHTML = '';

            const matches = globalFilesCache.filter(f => f.title.toLowerCase().includes(query));
            if (matches.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No matching results found.</p>';
                return;
            }

            matches.forEach(item => {
                const isFav = favorites.some(f => f.link === item.link);
                const downloadUrl = getDirectDownloadUrl(item.link);
                const isRecItem = item.folderName.toLowerCase().includes('recode');

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-navy-800 p-4 rounded-xl border border-gray-300 dark:border-navy-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow transition ${isRecItem ? 'recode-hover-card' : 'theme-hover-card'}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 text-left">
                        <i class="${isRecItem ? 'fas fa-microphone text-purple-500' : 'fas fa-file-pdf text-red-500'} text-xl flex-shrink-0"></i>
                        <div>
                            <h4 class="font-bold text-sm">${item.title}</h4>
                            <p class="text-xs text-gray-400 mt-1"><span class="text-blue-400">${item.subjectName}</span> / <span class="text-yellow-500">${item.folderName}</span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-start">
                        <button onclick="openViewer('${item.link}', '${item.title}')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs">
                            <i class="fas fa-eye"></i> View
                        </button>
                        <a href="${downloadUrl}" class="dynamic-bg text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1">
                            <i class="fas fa-download"></i> Download
                        </a>
                        <button onclick="toggleFavorite('${item.title}', '${item.link}', '${item.subjectName}', '${item.folderName}', this)" class="p-2 transition hover:scale-110">
                            <i class="${isFav ? 'fas text-red-500' : 'far text-gray-400'} fa-heart text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showFavoritesUI() {
            document.getElementById('subjects-grid').classList.add('hidden');
            document.getElementById('folders-section').classList.add('hidden');
            document.getElementById('files-section').classList.add('hidden');
            document.getElementById('search-results-section').classList.add('hidden');
            document.getElementById('favorites-section').classList.remove('hidden');

            const container = document.getElementById('favorites-container');
            container.innerHTML = '';

            if (favorites.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No favorite lectures or videos added yet.</p>';
                return;
            }

            favorites.forEach(item => {
                const isYouTube = item.link.includes('youtube.com') || item.link.includes('youtu.be');
                const downloadUrl = getDirectDownloadUrl(item.link);
                const isRecFav = item.folderName.toLowerCase().includes('recode');

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-navy-800 p-4 rounded-xl border border-gray-300 dark:border-navy-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow transition ${isRecFav ? 'recode-hover-card' : 'theme-hover-card'}`;
                
                card.innerHTML = `
                    <div class="flex items-center gap-3 text-left">
                        <i class="${isYouTube ? 'fab fa-youtube text-red-500' : (isRecFav ? 'fas fa-microphone text-purple-500' : 'fas fa-file-pdf text-red-500')} text-xl flex-shrink-0"></i>
                        <div>
                            <h4 class="font-bold text-sm">${item.title}</h4>
                            <p class="text-xs text-gray-400 mt-1"><span class="text-blue-400">${item.subjectName}</span> / <span class="text-yellow-500">${item.folderName}</span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-start">
                        ${isYouTube ? 
                            `<a href="${item.link}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1"><i class="fas fa-play"></i> Watch</a>` :
                            `<button onclick="openViewer('${item.link}', '${item.title}')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs"><i class="fas fa-eye"></i> View</button>
                             <a href="${downloadUrl}" class="dynamic-bg text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1"><i class="fas fa-download"></i> Download</a>`
                        }
                        <button onclick="toggleFavorite('${item.title}', '${item.link}', '${item.subjectName}', '${item.folderName}', this); showFavoritesUI();" class="p-2 text-red-500 transition hover:scale-110">
                            <i class="fas fa-heart text-lg"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openViewer(link, title) {
            let previewUrl = link;
            if (link.includes('/view')) {
                previewUrl = link.replace('/view', '/preview');
            } else if (!link.includes('/preview')) {
                previewUrl = link + (link.includes('?') ? '&' : '?') + 'usp=sharing';
            }
            document.getElementById('modal-file-title').innerText = title;
            document.getElementById('viewer-iframe').src = previewUrl;
            document.getElementById('viewer-modal').classList.remove('hidden');
        }

        function closeViewer() {
            document.getElementById('viewer-modal').classList.add('hidden');
            document.getElementById('viewer-iframe').src = '';
        }
    </script>
</body>
</html>
